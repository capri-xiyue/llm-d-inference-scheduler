# hostNetwork model-server pods bound to the control node, as Exos creates for
# Borneo runners. They carry no traffic; they show that Pod-based discovery
# sees the control node IP for every runner. Deployments (not bare Pods) so they
# come back after GKE drains or recreates the node.
apiVersion: v1
kind: Namespace
metadata:
  name: prediction
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-runner-0
  namespace: prediction
spec:
  replicas: 1
  selector:
    matchLabels: {app: glm52, exos/runner-id: runner-0}
  template:
    metadata:
      labels: {app: glm52, exos/runner-id: runner-0}
    spec:
      nodeSelector: {exos-poc/control-node: "true"}
      hostNetwork: true
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-runner-1
  namespace: prediction
spec:
  replicas: 1
  selector:
    matchLabels: {app: glm52, exos/runner-id: runner-1}
  template:
    metadata:
      labels: {app: glm52, exos/runner-id: runner-1}
    spec:
      nodeSelector: {exos-poc/control-node: "true"}
      hostNetwork: true
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.10
