<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
  <style>
    text { font-family: Roboto, Arial, sans-serif; fill: #202124; }
    .t  { font-size: 16px; font-weight: 700; }
    .g  { font-size: 12.5px; fill: #5f6368; }
    .s  { font-size: 14px; }
    .m  { font-family: "Roboto Mono", "DejaVu Sans Mono", monospace; font-size: 12.5px; }
    .num { font-weight: 700; }
    .h { paint-order: stroke; stroke: #ffffff; stroke-width: 6px; stroke-linejoin: round; }
    .blue { fill: #1967d2; } .gray { fill: #5f6368; } .green { fill: #137333; }
  </style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#80868b"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#188038"/></marker>
  </defs>
  <rect width="1400" height="620" fill="#ffffff"/>

  <!-- Participants -->
  <rect x="60"   y="20" width="200" height="62" rx="12" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
  <text x="160" y="47" text-anchor="middle" class="t">Client</text>
  <text x="160" y="68" text-anchor="middle" class="g">curl pod</text>
  <rect x="410"  y="20" width="220" height="62" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.8"/>
  <text x="520" y="47" text-anchor="middle" class="t">Envoy</text>
  <text x="520" y="68" text-anchor="middle" class="g">Deployment ×2</text>
  <rect x="770"  y="20" width="220" height="62" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.8"/>
  <text x="880" y="47" text-anchor="middle" class="t">EPP</text>
  <text x="880" y="68" text-anchor="middle" class="g">standalone · ext_proc server</text>
  <rect x="1120" y="20" width="240" height="62" rx="12" fill="#e6f4ea" stroke="#188038" stroke-width="1.8"/>
  <text x="1240" y="47" text-anchor="middle" class="t">vLLM runner</text>
  <text x="1240" y="68" text-anchor="middle" class="g">GCE VM · 10.30.0.10 / .14</text>

  <!-- Lifelines -->
  <g stroke="#bdc1c6" stroke-width="1.5" stroke-dasharray="5,5">
    <line x1="160" y1="82" x2="160" y2="605"/>
    <line x1="520" y1="82" x2="520" y2="605"/>
    <line x1="880" y1="82" x2="880" y2="605"/>
    <line x1="1240" y1="82" x2="1240" y2="605"/>
  </g>

  <!-- 1 -->
  <text x="340" y="122" text-anchor="middle" class="s blue h"><tspan class="num">1</tspan>  POST /v1/chat/completions</text>
  <line x1="160" y1="132" x2="517" y2="132" stroke="#1a73e8" stroke-width="2.5" marker-end="url(#ab)"/>

  <!-- 2 -->
  <text x="700" y="172" text-anchor="middle" class="s blue h"><tspan class="num">2</tspan>  ext_proc: request headers + body</text>
  <line x1="520" y1="182" x2="877" y2="182" stroke="#1a73e8" stroke-width="2.5" marker-end="url(#ab)"/>

  <!-- EPP note -->
  <rect x="680" y="204" width="400" height="86" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="880" y="227" text-anchor="middle" class="s" style="font-weight:700">Pick an endpoint</text>
  <text x="880" y="248" text-anchor="middle" class="g">candidates = ready endpoints from the EndpointSlices</text>
  <text x="880" y="267" text-anchor="middle" class="g">queue-scorer + kv-cache-utilization-scorer</text>
  <text x="880" y="284" text-anchor="middle" class="g">→ max-score-picker</text>

  <!-- 2' -->
  <text x="700" y="318" text-anchor="middle" class="s blue h">ext_proc reply sets header</text>
  <text x="700" y="338" text-anchor="middle" class="m blue h" style="font-size:11.5px">x-gateway-destination-endpoint: 10.30.0.14:9080</text>
  <line x1="880" y1="350" x2="523" y2="350" stroke="#1a73e8" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#ab)"/>

  <!-- 3 -->
  <text x="880" y="390" text-anchor="middle" class="s blue h"><tspan class="num">3</tspan>  ORIGINAL_DST → 10.30.0.14:9080  (the request, unchanged)</text>
  <line x1="520" y1="400" x2="1237" y2="400" stroke="#1a73e8" stroke-width="3" marker-end="url(#ab)"/>

  <!-- response -->
  <text x="880" y="440" text-anchor="middle" class="s green h">200 + completion</text>
  <line x1="1240" y1="450" x2="523" y2="450" stroke="#188038" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#an)"/>

  <text x="700" y="490" text-anchor="middle" class="s gray h">ext_proc: response headers + body (usage)</text>
  <line x1="520" y1="500" x2="877" y2="500" stroke="#80868b" stroke-width="2" stroke-dasharray="2,4" marker-end="url(#ag)"/>

  <text x="340" y="550" text-anchor="middle" class="s green h">200 + completion</text>
  <line x1="520" y1="560" x2="163" y2="560" stroke="#188038" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#an)"/>
</svg>
